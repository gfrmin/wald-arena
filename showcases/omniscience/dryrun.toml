# The dry run's numbers: PROPOSALS from QUESTIONS.md's pre-registration, NOT rulings. Read only by
# `python -m showcases.omniscience.run --dry-run`, which refuses any model but claude-haiku-4-5-20251001.
# Haiku stands in for the primary, the second opinion and the grader, so it grades its own answers: the result
# proves the plumbing and nothing about the fit.

lambda_usd = "1"
penalties = [1, 3, 10]
# A subset of 2.10's grid, for time (QUESTIONS.md 2.24); "none" cannot be shipped calibration Counts that use the
# second opinion (2.22).
second_price_grid = ["1/10", "1"]
split_seed = 20260923
sampling_seed = 1
plate_seed = 20260925                 # 2.20: the order questions enter each plate

[confidence]
cuts = [50, 80]                       # 2.5 proposes [50, 80, 95]; four buckets keep the dry run's World at 128 Globals

# 2.15: the Globals' hypotheses. P(Global) is uniform over their product.
[globals]
rho = ["1/10", "7/10"]                                  # the primary's reliability, per bucket
agree = [["4/5", "1/5"], ["1/2", "1/2"]]                # (a+, a-): informative agreement, or not
second = [["1/2", "4/5", "1/5"], ["1/10", "4/5", "1/2"]]  # (sigma, alpha, beta)
grader = ["9/10", "1"]                                  # gamma

# 2.21: the calibration split's own plate, every observation priced 0.
[calibration_plate]
p = "1"
c = "0"

[agreement]
samples = 5
price = "per_call"      # the primary's declared price per call, times the number of samples

# Declared prices are upper bounds, not measurements: Haiku 4.5 list prices ($1 in, $5 out per million tokens) times
# the largest prompt each role sends and its max_tokens. An answer or confidence call: <= 300 tokens in, <= 64 out,
# <= $0.00062. A grading call: <= 2,200 in, <= 8 out, <= $0.00224. The runner also records list-price dollars from
# the tokens actually used, so the declaration can be audited (rule 5).
[instruments.primary]
provider = "anthropic"
model = "claude-haiku-4-5-20251001"
usd_per_call = "0.0007"
max_tokens = 64

[instruments.second]
provider = "anthropic"
model = "claude-haiku-4-5-20251001"
usd_per_call = "0.0007"
max_tokens = 64

[instruments.grader]
provider = "anthropic"
model = "claude-haiku-4-5-20251001"
usd_per_call = "0.0023"
max_tokens = 8

[list_price_per_mtok."claude-haiku-4-5-20251001"]
input = "1"
output = "5"
