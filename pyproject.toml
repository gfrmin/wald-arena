[project]
name = "wald-arena"
version = "0.0.0"
description = "wald's entries on public boards, and the explainers that teach how it decides"
requires-python = ">=3.12"
dependencies = [
    "wald",
]

[project.optional-dependencies]
llm = ["anthropic>=1", "openai>=1"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false

[tool.uv.sources]
wald = { git = "https://github.com/gfrmin/wald", tag = "v0.1.0" }
